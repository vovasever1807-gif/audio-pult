<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт тифлокомментария</title>
<meta name="theme-color" content="#0d0f12">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0d0f12;
    --fg: #f2f4f7;
    --dim: #9aa3ad;
    --accent: #ffd166;
    --btn: #1c2026;
    --btn-active: #2b323b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100vh;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }
  header { text-align: center; padding: 4px 0 0; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  #ver { font-size: 12px; color: var(--dim); }
  #clock {
    font-size: 40px; font-variant-numeric: tabular-nums;
    letter-spacing: 1px; line-height: 1.15; color: var(--accent);
  }
  #state { font-size: 16px; color: var(--dim); min-height: 22px; }

  button {
    font: inherit; color: var(--fg);
    background: var(--btn);
    border: 2px solid #333b45;
    border-radius: 16px;
    min-height: 84px;
    padding: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:active, button.pressed { background: var(--btn-active); border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: .45; }
  .big { font-size: 22px; font-weight: 600; }
  .sym { font-size: 30px; line-height: 1; }
  .sub { font-size: 13px; color: var(--dim); }

  .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 12px; }
  .row.four { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .primary { min-height: 120px; border-color: var(--accent); }

  #loadBox {
    border: 2px dashed #333b45; border-radius: 16px;
    padding: 16px; text-align: center;
  }
  #loadBox p { margin: 0 0 12px; color: var(--dim); font-size: 15px; }
  #pick { min-height: 64px; width: 100%; }
  #fileName { font-size: 14px; color: var(--dim); margin-top: 8px; word-break: break-all; }

  #live {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Пульт тифлокомментария</h1>
  <div id="ver">сборка v7</div>
  <div id="clock" role="timer" aria-live="off">00:00:00</div>
  <div id="state">Дорожка не загружена</div>
</header>

<div id="loadBox">
  <p>Выбери файл дорожки. Он сохранится в телефоне и больше не понадобится.</p>
  <button id="pick" type="button">
    <span class="big">Выбрать аудиофайл</span>
    <span class="sub">mp3 из загрузок</span>
  </button>
  <div id="fileName"></div>
  <input id="file" type="file" accept="audio/*" class="hidden">
</div>

<main id="controls" class="hidden">
  <button id="listen" class="primary" type="button" aria-pressed="false">
    <span class="big" id="listenLabel">Слушать фильм</span>
    <span class="sub" id="listenSub">фильм включи в любом месте</span>
  </button>

  <button id="play" class="primary" type="button" aria-label="Пуск" style="margin-top:12px">
    <span class="sym" id="playSym">▶</span>
    <span class="big" id="playLabel">Пуск</span>
  </button>

  <div class="row four">
    <button id="back5" type="button" aria-label="Сдвинуть комментарий назад на пять секунд"><span class="sym">−5</span><span class="sub">секунд</span></button>
    <button id="back1" type="button" aria-label="Сдвинуть комментарий назад на секунду"><span class="sym">−1</span><span class="sub">секунда</span></button>
    <button id="fwd1" type="button" aria-label="Сдвинуть комментарий вперёд на секунду"><span class="sym">+1</span><span class="sub">секунда</span></button>
    <button id="fwd5" type="button" aria-label="Сдвинуть комментарий вперёд на пять секунд"><span class="sym">+5</span><span class="sub">секунд</span></button>
  </div>

  <div class="row">
    <button id="home" type="button" aria-label="Вернуть дорожку в начало">
      <span class="sym">⏮</span><span class="sub">в начало</span>
    </button>
    <button id="where" type="button" aria-label="Сказать, где сейчас дорожка">
      <span class="big">Где я</span><span class="sub">время вслух</span>
    </button>
  </div>

  <div class="row">
    <button id="slower" type="button" aria-label="Сменить дорожку">
      <span class="big">Другая дорожка</span><span class="sub">выбрать файл</span>
    </button>
    <button id="report" type="button" aria-label="Сохранить отчёт о подстройке">
      <span class="big">Отчёт</span><span class="sub">файл для настройки</span>
    </button>
  </div>
</main>

<div id="live" aria-live="polite" role="status"></div>
<audio id="audio" preload="auto"></audio>

<script>
(function () {
  'use strict';

  var audio = document.getElementById('audio');
  var clock = document.getElementById('clock');
  var state = document.getElementById('state');
  var live = document.getElementById('live');
  var fileInput = document.getElementById('file');
  var controls = document.getElementById('controls');
  var loadBox = document.getElementById('loadBox');
  var fileName = document.getElementById('fileName');
  var playSym = document.getElementById('playSym');
  var playLabel = document.getElementById('playLabel');

  var DB_NAME = 'pult-ad', STORE = 'files', KEY = 'track';
  var HZ = 10, DT = 1 / HZ;

  // ---------- хранение дорожки ----------

  function openDB() {
    return new Promise(function (resolve, reject) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }

  function saveBlob(blob) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, KEY);
        tx.oncomplete = resolve;
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function loadBlob() {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).get(KEY);
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }

  function say(text) {
    live.textContent = '';
    setTimeout(function () { live.textContent = text; }, 60);
  }

  function nowS() { return performance.now() / 1000; }

  // ---------- дорожка ----------

  var ep = null;            // код серии из имени файла
  var ref = null;           // карта речи фильма, 10 Гц
  var refCoarse = null;     // то же, 2 Гц

  function epFromName(name) {
    var m = /s(\d{1,2})e(\d{1,2})/i.exec(name || '');
    return m ? ('s' + ('0' + m[1]).slice(-2) + 'e' + ('0' + m[2]).slice(-2)) : null;
  }

  function loadRef(code) {
    if (!code) return Promise.resolve(null);
    return fetch('timing/' + code + '_dlg.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.map) return null;
        var step = j.step || 0.1;
        var n = j.map.length;
        var fine = new Float32Array(n);
        var k, i;
        for (i = 0; i < n; i++) fine[i] = j.map.charCodeAt(i) === 49 ? 1 : 0;
        // сглаживание 0,4 с — как у микрофонного сигнала
        var w = Math.max(1, Math.round(0.4 / step));
        var acc = 0, out = new Float32Array(n);
        for (i = 0; i < n; i++) {
          acc += fine[i];
          if (i >= w) acc -= fine[i - w];
          out[i] = acc / Math.min(i + 1, w);
        }
        var f = Math.round(0.5 / step);          // точек на полсекунды
        var nc = Math.floor(n / f);
        var coarse = new Float32Array(nc);
        for (k = 0; k < nc; k++) {
          var s = 0;
          for (i = 0; i < f; i++) s += out[k * f + i];
          coarse[k] = s / f;
        }
        return { fine: out, coarse: coarse, dur: j.dur, step: step };
      })
      .catch(function () { return null; });
  }

  var anchorW = 0;      // время по часам телефона
  var anchorFilm = 0;   // соответствующее время фильма

  function filmNow() {
    if (audio.paused) return audio.currentTime;
    return anchorFilm + (nowS() - anchorW);
  }

  function reanchor() {
    anchorW = nowS();
    anchorFilm = audio.currentTime;
  }

  function tick() {
    clock.textContent = fmt(audio.paused ? audio.currentTime : filmNow());
  }

  function attach(src) {
    audio.src = src;
    controls.classList.remove('hidden');
    loadBox.classList.add('hidden');
    state.textContent = 'Дорожка готова. Нажми «Слушать фильм» и включи фильм.';
    tick();
  }

  function useFile(file) {
    var url = URL.createObjectURL(file);
    attach(url);
    fileName.textContent = file.name || '';
    ep = epFromName(file.name);
    try { localStorage.setItem('pult.ep', ep || ''); } catch (e) {}
    ref = null; refCoarse = null; lock = null;
    mic.hist.length = 0;
    saveBlob(file).catch(function () {});
    loadRef(ep).then(function (r) {
      ref = r ? r.fine : null;
      refCoarse = r ? r.coarse : null;
      if (!r && ep) state.textContent = 'Для этой серии нет карты речи — подстройка только вручную';
    });
  }

  document.getElementById('pick').addEventListener('click', function () { fileInput.click(); });
  document.getElementById('slower').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) useFile(fileInput.files[0]);
  });

  function setPlaying(isPlaying) {
    playSym.textContent = isPlaying ? '❚❚' : '▶';
    playLabel.textContent = isPlaying ? 'Пауза' : 'Пуск';
    document.getElementById('play').setAttribute('aria-label', isPlaying ? 'Пауза' : 'Пуск');
    if (isPlaying) reanchor();
  }

  document.getElementById('play').addEventListener('click', function () {
    if (audio.paused) {
      audio.play().catch(function () { say('Не удалось запустить звук'); });
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', function () { setPlaying(true); tick(); });
  audio.addEventListener('pause', function () {
    setPlaying(false);
    mic.hist.length = 0;          // история после паузы бесполезна
    tick();
  });
  audio.addEventListener('ended', function () {
    setPlaying(false);
    state.textContent = 'Дорожка закончилась';
  });
  audio.addEventListener('error', function () { state.textContent = 'Ошибка файла'; });

  function nudge(d) {
    var dur = audio.duration || 1e9;
    var t = Math.max(0, Math.min(dur - 1, (audio.paused ? audio.currentTime : filmNow()) + d));
    audio.currentTime = t;
    reanchor();
    state.textContent = 'Сдвиг вручную ' + (d > 0 ? '+' : '−') + Math.abs(d) + ' с';
    say((d > 0 ? 'Вперёд' : 'Назад') + ' на ' + Math.abs(d) + ' секунд');
    tick();
  }

  ['back5', 'back1', 'fwd1', 'fwd5'].forEach(function (id) {
    var d = { back5: -5, back1: -1, fwd1: 1, fwd5: 5 }[id];
    document.getElementById(id).addEventListener('click', function () { nudge(d); });
  });

  document.getElementById('home').addEventListener('click', function () {
    audio.pause();
    audio.currentTime = 0;
    reanchor();
    mic.hist.length = 0;
    say('В начало');
    tick();
  });

  document.getElementById('where').addEventListener('click', function () {
    var now = audio.paused ? audio.currentTime : filmNow();
    var m = Math.floor(now / 60), s = Math.floor(now % 60);
    say('Сейчас ' + m + ' минут ' + s + ' секунд');
  });

  document.getElementById('report').addEventListener('click', function () {
    var lines = log.slice(-400).join('\n') || 'нет данных';
    var blob = new Blob(['сборка v7, серия ' + (ep || '?') + '\n' + lines + '\n'], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pult-report-' + Date.now() + '.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    say('Отчёт сохранён в загрузки');
  });

  // ---------- микрофон ----------

  var mic = {
    on: false, ctx: null, analyser: null, stream: null,
    freq: null, lo: 0, hi: 0,
    hist: [],                 // {w, v} — 10 точек в секунду
    ring: [],                 // сырые уровни за последние 10 с — для порога
    loudMs: 0, quietMs: 0, loud: false, started: 0,
    armed: false
  };
  var lock = null;            // {offset, ncc, margin}: фильм = offset + часы
  var log = [];
  var lastMeasure = 0, lastApplied = 0, pending = null;

  function startMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      state.textContent = 'Микрофон недоступен';
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false }
    }).then(function (stream) {
      mic.stream = stream;
      var Ctx = window.AudioContext || window.webkitAudioContext;
      mic.ctx = new Ctx();
      var src = mic.ctx.createMediaStreamSource(stream);
      mic.analyser = mic.ctx.createAnalyser();
      mic.analyser.fftSize = 1024;
      mic.analyser.smoothingTimeConstant = 0.5;
      src.connect(mic.analyser);
      mic.freq = new Uint8Array(mic.analyser.frequencyBinCount);
      var bin = mic.ctx.sampleRate / mic.analyser.fftSize;
      mic.lo = Math.max(1, Math.round(300 / bin));
      mic.hi = Math.min(mic.freq.length - 1, Math.round(3000 / bin));
      mic.on = true;
      mic.hist.length = 0;
      mic.started = nowS();
      mic.armed = !audio.paused ? false : true;
      missCount = 0;
      document.getElementById('listen').setAttribute('aria-pressed', 'true');
      document.getElementById('listenLabel').textContent = 'Слушаю';
      document.getElementById('listenSub').textContent = 'включи фильм';
      state.textContent = ref ? 'Слушаю планшет. Включи фильм в любом месте.' : 'Слушаю планшет.';
      say('Слушаю. Включай фильм.');
      loop();
    }).catch(function () {
      state.textContent = 'Нет доступа к микрофону';
      say('Нет доступа к микрофону');
    });
  }

  function stopMic() {
    mic.on = false;
    if (mic.stream) mic.stream.getTracks().forEach(function (t) { t.stop(); });
    if (mic.ctx) { try { mic.ctx.close(); } catch (e) {} }
    mic.stream = null; mic.ctx = null; mic.analyser = null;
    document.getElementById('listen').setAttribute('aria-pressed', 'false');
    document.getElementById('listenLabel').textContent = 'Слушать фильм';
    document.getElementById('listenSub').textContent = 'фильм включи в любом месте';
    state.textContent = 'Слушание выключено';
    say('Слушание выключено');
    tick();
  }

  var missCount = 0;

  function bandRaw() {
    mic.analyser.getByteFrequencyData(mic.freq);
    var s = 0, i;
    for (i = mic.lo; i <= mic.hi; i++) s += mic.freq[i];
    return s / (mic.hi - mic.lo + 1);
  }

  // порог = 25-й процентиль за последние 10 с: музыка и речь поднимают
  // уровень, тишина между репликами — нет
  function floorOf() {
    var arr = mic.ring.slice().sort(function (a, b) { return a - b; });
    return arr[Math.floor(arr.length * 0.25)];
  }

  function normalize(band, floor) {
    var v = (band - floor - 8) / 26;
    return v < 0 ? 0 : (v > 1 ? 1 : v);
  }

  function loop() {
    if (!mic.on) return;
    var now = nowS();
    var raw = bandRaw();

    mic.ring.push(raw);
    if (mic.ring.length > 100) mic.ring.shift();
    var band = normalize(raw, floorOf());
    var loud = band > 0.15;

    mic.hist.push({ w: now, v: band });
    if (mic.hist.length > 1600) mic.hist.shift();

    if (loud) {
      mic.loudMs += 100;
      mic.quietMs = 0;
    } else {
      mic.quietMs += 100;
      mic.loudMs = 0;
    }
    mic.loud = loud;

    // автостарт: услышали устойчивый звук фильма
    if (mic.armed && loud && mic.loudMs >= 1200 && audio.paused && now - mic.started < 900) {
      mic.armed = false;
      audio.currentTime = 0;
      audio.play().then(function () {
        reanchor();
        state.textContent = 'Поехали, ищу точное место';
        say('Слышу фильм, поехали');
        tick();
      }).catch(function () {});
    }

    if (ref && refCoarse && now - lastMeasure > 6 && mic.hist.length > HZ * 20) {
      lastMeasure = now;
      measure();
    }

    setTimeout(loop, 100);
  }

  // ---------- корреляция ----------

  function histWindow(sec) {
    var cut = nowS() - sec;
    var out = [];
    for (var i = 0; i < mic.hist.length; i++) {
      var h = mic.hist[i];
      if (h.w >= cut) out.push(h);
    }
    return out;
  }

  function windowValues(sec) {
    var hs = histWindow(sec);
    if (hs.length < sec * HZ * 0.7) return null;
    var start = hs[0].w, n = Math.floor((hs[hs.length - 1].w - start) / DT) + 1;
    var vals = new Float32Array(n), seen = 0, j = 0;
    for (var i = 0; i < hs.length; i++) {
      var k = Math.round((hs[i].w - start) / DT);
      if (k >= 0 && k < n) { vals[k] += hs[i].v; seen++; }
      j++;
    }
    // сглаживание 0,4 с
    var w = 4, acc = 0, out = new Float32Array(n);
    for (i = 0; i < n; i++) {
      acc += vals[i];
      if (i >= w) acc -= vals[i - w];
      out[i] = acc / Math.min(i + 1, w);
    }
    return { vals: out, start: start };
  }

  function ncc(mv, mc, rc, lagC) {
    var n = mc.length, sa = 0, saa = 0, sb = 0, sbb = 0, sab = 0, i, k;
    for (i = 0; i < n; i++) { sa += mv[i]; saa += mv[i] * mv[i]; }
    for (i = 0; i < n; i++) {
      k = lagC + i;
      if (k < 0 || k >= rc.length) return null;
      sb += rc[k]; sbb += rc[k] * rc[k]; sab += mv[i] * rc[k];
    }
    var va = saa - sa * sa / n, vb = sbb - sb * sb / n;
    if (va <= 0 || vb <= 0) return null;
    return (sab - sa * sb / n) / Math.sqrt(va * vb);
  }

  function measure() {
    var win = lock ? 60 : 90;
    var wv = windowValues(win);
    if (!wv) return;
    var fine = wv.vals, n = fine.length;
    var nc = Math.floor(n / 5), mc = new Float32Array(nc), mf = new Float32Array(nc);
    var i, c;
    for (i = 0; i < nc; i++) {
      var s = 0;
      for (var j = 0; j < 5; j++) s += fine[i * 5 + j];
      mc[i] = s / 5;
    }
    var rc = refCoarse;
    var lo = 0, hi = rc.length - nc;
    if (lock) {
      // ожидаемое место окна: фильм = offset + часы, окно начинается в wv.start
      var expectC = Math.round((lock.offset + wv.start) / (5 * DT));
      lo = Math.max(0, expectC - 20);
      hi = Math.min(hi, expectC + 20);
    }
    if (hi <= lo) return;

    var bestC = -2, bestLag = -1, second = -2;
    for (var lagC = lo; lagC <= hi; lagC++) {
      c = ncc(mc, mc, rc, lagC);
      if (c === null) continue;
      if (c > bestC) { bestC = c; bestLag = lagC; }
    }
    if (bestLag < 0) return;
    // второй пик не ближе 3 с — нужен для оценки уверенности
    for (lagC = lo; lagC <= hi; lagC++) {
      if (Math.abs(lagC - bestLag) < 6) continue;
      c = ncc(mc, mc, rc, lagC);
      if (c !== null && c > second) second = c;
    }
    var margin = bestC / Math.max(second, 0.05);

    // уточнение на 0,1 с
    var fineLo = bestLag * 5 - 4, fineHi = bestLag * 5 + 4, bestFine = bestLag * 5, bestFineC = bestC;
    for (var lagF = fineLo; lagF <= fineHi; lagF++) {
      c = ncc(fine, fine, ref, lagF);
      if (c !== null && c > bestFineC) { bestFineC = c; bestFine = lagF; }
    }

    var estFilmStart = bestFine * DT;
    var estFilmNow = estFilmStart + n * DT;
    var estOffset = estFilmNow - (wv.start + n * DT);   // фильм минус часы
    var err = estFilmNow - filmNow();

    log.push([new Date().toISOString().slice(11, 19), 'win=' + win, 'ncc=' + bestC.toFixed(2),
      'margin=' + margin.toFixed(2), 'est=' + estFilmNow.toFixed(1), 'err=' + err.toFixed(1),
      'locked=' + (lock ? 1 : 0)].join(' '));

    var confident = bestC >= 0.30 && margin >= 1.10;
    if (!confident) {
      missCount++;
      if (missCount > 6) state.textContent = lock ? 'Слушаю, совпадение пока слабое' : 'Пока не вижу, где фильм';
      return;
    }
    missCount = 0;

    if (!lock) {
      lock = { offset: estOffset, ncc: bestC, margin: margin };
      applyJump(estFilmNow, 'нашёл место');
      return;
    }

    if (Math.abs(err) <= 0.6) { pending = null; return; }
    if (nowS() - lastApplied <= 8) return;

    if (Math.abs(err) > 3) {
      // большой сдвиг — только если его подтвердил второй замер
      if (bestC >= 0.36 && margin >= 1.18 && pending && nowS() - pending.at < 20 &&
          Math.abs(pending.err - err) < 1.5) {
        pending = null;
        lock.offset = estOffset;
        applyJump(estFilmNow, 'поправил');
      } else {
        pending = { err: err, at: nowS() };
      }
      return;
    }

    pending = null;
    lock.offset = estOffset;
    applyJump(estFilmNow, 'поправил');
  }

  function applyJump(target, why) {
    var dur = audio.duration || 1e9;
    if (target >= dur - 0.5) { state.textContent = 'Дорожка кончилась'; return; }
    var delta = target - filmNow();
    audio.currentTime = Math.max(0, target);
    reanchor();
    lastApplied = nowS();
    lock = lock || {};
    lock.offset = audio.currentTime - nowS();
    log.push([new Date().toISOString().slice(11, 19), why, 'delta=' + delta.toFixed(1)].join(' '));
    state.textContent = why + (Math.abs(delta) >= 1 ? ': сдвиг ' + Math.round(delta) + ' с' : '');
    if (Math.abs(delta) > 8) say(why + ' на ' + Math.round(Math.abs(delta)) + ' секунд');
    tick();
  }

  document.getElementById('listen').addEventListener('click', function () {
    if (mic.on) { stopMic(); return; }
    startMic();
  });

  loadBlob().then(function (rec) {
    if (!rec) return;
    attach(URL.createObjectURL(rec));
    ep = epFromName(rec.name || '') || (function () {
      try { return localStorage.getItem('pult.ep') || null; } catch (e) { return null; }
    })();
    loadRef(ep).then(function (r) {
      ref = r ? r.fine : null;
      refCoarse = r ? r.coarse : null;
    });
    state.textContent = 'Дорожка на месте. Нажми «Слушать фильм» и включи фильм.';
  }).catch(function () {});

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
